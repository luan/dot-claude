[package]
name = "ct"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ct"
path = "tools/main.rs"

[[test]]
name = "apply_patch_contract"
path = "tools/tests/apply_patch_contract.rs"

[[test]]
name = "cli_contract"
path = "tools/tests/cli_contract.rs"

[dependencies]
clap = { version = "^4", features = ["derive"] }
clap_complete = "^4"
dirs = "^6"
image = "^0.25"
regex = "^1"
rmcp = { version = "^1", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "^0.39", features = ["bundled"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
sha1 = "^0.11"
similar = "^3"
sym = { path = "tools/crates/sym" }
thiserror = "^2"
tokio = { version = "^1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
assert_cmd = "^2"
predicates = "^3"
tempfile = "^3"
