[package]
name = "ct"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "^4", features = ["derive"] }
clap_complete = "^4"
crossterm = "^0.28"
dirs = "^6"
image = "^0.25"
fs-notify = { package = "notify", version = "^7" }
ratatui = "^0.30"
regex = "^1"
rmcp = { version = "^1", features = ["server", "macros", "transport-io"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tokio = { version = "^1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
assert_cmd = "^2"
predicates = "^3"
tempfile = "^3"
